name: daily-post

on:
  schedule:
    - cron: "17 21 * * *"   # 毎朝 6:17 (日本時間)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1=テスト（投稿しない） / 0=本番投稿"
        default: "1"

permissions:
  contents: write

concurrency: daily-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: SNSへ投稿
        env:
          PLATFORMS: facebook
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/images
        run: python post.py

      - name: 投稿済みの記録を保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add schedule.csv
          git diff --cached --quiet || (git commit -m "posted $(date +%F)" && git push)
